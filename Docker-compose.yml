version: '3.8'

services:
  nexussms:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - NEXUSSMS_DB=/data/nexus_sms.db
      - NEXUSSMS_CONFIG=/app/config.json
      - PORT=${PORT:-5000}
      - HOST=0.0.0.0
    volumes:
      - ./data:/data
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
